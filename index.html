<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KANAL 0 — Personlig stjernekart</title><link rel="stylesheet" href="style.css"></head>
<body data-scene="off">
<button class="mode" id="mode">Enkel visning</button>
<header class="stitle"><b>KANAL 0</b> Stjernekart</header>
<main class="room">
 <div class="tv" id="tv">
  <div class="screen" id="screen">
   <canvas id="sky"></canvas><canvas id="static"></canvas>
   <div class="ident" id="ident">KANAL<b>0</b></div>
   <div class="osd live" id="live">● LIVE</div>
   <div class="osd info" id="info"></div>
   <div class="osd cap" id="capShow"></div>
   <div class="dot" id="dot"></div>
   <div class="scan"></div>
  </div>
  <div class="panel"><span class="brand">KANAL 0</span><button class="knob" id="knob" aria-label="Slå på"></button></div>
 </div>
 <p class="hint" id="hint">Trykk på knappen — <button id="on" class="btn">Slå på</button></p>

 <section class="osdform" id="form">
  <label>Sted<select id="place"></select></label>
  <label>Dato<input type="date" id="date"></label>
  <label>Tid<input type="time" id="time" value="22:00"></label>
  <label class="wide">Tekst<input id="cap" maxlength="40" placeholder="Natten vi møttes"></label>
  <label class="chk"><input type="checkbox" id="lines" checked> Stjernebilder</label>
  <p class="tip">Dra på skjermen for å se deg rundt.</p>
 </section>

 <section class="print" id="print">
  <canvas id="poster" width="600" height="800"></canvas>
  <div class="opts">
   <div class="seg" id="styles"><button data-s="midnatt" class="on">Midnatt</button><button data-s="dyp">Dyp blå</button><button data-s="lys">Lys papir</button></div>
   <div class="seg" id="sizes"><button data-z="30×40" data-p="399" class="on">30×40 · 399</button><button data-z="50×70" data-p="549">50×70 · 549</button></div>
  </div>
 </section>

 <section class="checkout" id="checkout">
  <div class="card"><span class="demo">DEMO — ingen betaling</span>
   <h2>Din sending</h2><p id="sum"></p>
   <div class="seg" id="ship"><button data-c="99" class="on">Norge · Posten/Helthjem 99</button><button data-c="199">Utland 199</button></div>
   <p class="tot">Totalt <b id="tot"></b> NOK</p>
   <button class="btn big" id="order">Bestill — send i luften</button>
   <button class="link" id="back">← Tilbake</button></div>
 </section>

 <section class="done" id="done"><h1>KANAL 0 — sending nr. <span id="no"></span></h1><p>Episode låst. Demo: ingen ordre er sendt.</p><button class="btn" id="again">Ny sending</button></section>
</main>
<div class="bar" id="bar"><span id="barTxt">399 NOK + ~99 frakt</span><button class="btn" id="next">Se plakaten</button></div>
<script type="module" src="app.js"></script></body></html>
